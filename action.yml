name: 'vacuous'
description: 'Find tests that pass with or without the fix they claim to guard'
author: 'sokebo'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  mode:
    description: |
      What to run.
        audit  — the counterfactual: remove the fix, keep the test, see what happens.
        check  — static checks: skipped tests, discarded errors, guards that never run.
        all    — both.
    required: false
    default: 'all'

  limit:
    description: |
      How many commits to audit, newest first. 0 audits the whole history.
      The default is a window rather than "since the merge-base" on purpose:
      when the branch tip IS the default branch, the merge-base range is empty
      and the tool would report nothing while having examined nothing.
    required: false
    default: '20'

  fail-on:
    description: 'Lowest severity that fails the run: info | warn | high | critical'
    required: false
    default: 'high'

  base:
    description: 'Revision to audit against. Empty means "the most recent commits".'
    required: false
    default: ''

  commit:
    description: 'Audit a single commit instead of a range.'
    required: false
    default: ''

  go-version:
    description: 'Go version used to build vacuous and to run the project tests'
    required: false
    default: '1.26'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build vacuous
      # The action's own code lives in the action's checkout, not in the
      # caller's repository. Building it from github.workspace would compile
      # the caller's code under the name "vacuous".
      working-directory: ${{ github.action_path }}
      shell: bash
      run: go build -o "${{ runner.temp }}/vacuous" ./cmd/vacuous

    - name: Audit this repository
      shell: bash
      run: |
        "${{ runner.temp }}/vacuous" \
          --mode "${{ inputs.mode }}" \
          --limit "${{ inputs.limit }}" \
          --fail-on "${{ inputs.fail-on }}" \
          ${{ inputs.base && format('--base {0}', inputs.base) || '' }} \
          ${{ inputs.commit && format('--commit {0}', inputs.commit) || '' }}

    - name: Explain a non-zero exit
      # Exit code 1 means "findings above the threshold", which is the tool
      # working as intended. Exit code 2 means the tool itself could not
      # finish, and that deserves to be loud: a broken audit that looks like
      # a clean bill of health is the failure mode this tool exists to catch.
      if: failure()
      shell: bash
      run: |
        echo "::error::vacuous did not pass. Exit code 1 means it found" \
          "problems at or above the '${{ inputs.fail-on }}' severity;" \
          "the report above says which." \
          "Exit code 2 means the audit could not run at all."
