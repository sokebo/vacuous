name: Feature request
description: Something the tool should be able to do
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        `vacuous` answers one question: **if the fix is removed, does the test
        suite go red?**

        A feature request is strongest when it is phrased as another case of
        that question — because that is the part that has to stay true.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out?
      description: The question you are asking about a commit or a repository.
      placeholder: |
        "When this commit changes X, does any test actually depend on X?"
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What does the tool do today?
      description: And why is that not enough for your case?
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Go
        - Python
        - Node
        - Other
        - Not language-specific
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
