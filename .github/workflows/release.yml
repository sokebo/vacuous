name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The asset names are the contract with scripts/install.sh: it
        # downloads vacuous_<os>_<arch>.tar.gz. Renaming them here breaks
        # the install script for every user who uses it.
        include:
          - platform: darwin_arm64
            goos: darwin
            goarch: arm64
          - platform: darwin_x86_64
            goos: darwin
            goarch: amd64
          - platform: linux_x86_64
            goos: linux
            goarch: amd64
          - platform: linux_arm64
            goos: linux
            goarch: arm64
          - platform: windows_x86_64
            goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/sokebo/mavis-masterpiece/internal/cli.Version=${VERSION}" \
            -o "vacuous" ./cmd/vacuous

      - name: Smoke test the binary
        # A binary that does not start is worse than no release. This check
        # is the only thing standing between a broken build and every user
        # who installs it.
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          set -e
          chmod +x vacuous
          if [ "${GOOS}" = "windows" ]; then
            echo "Windows binaries are smoke tested on a Windows runner."
            exit 0
          fi
          ./vacuous --help > /dev/null
          ./vacuous --help | head -1
          echo "binary starts"

      - name: Package
        shell: bash
        run: |
          tar -czf "vacuous_${{ matrix.platform }}.tar.gz" vacuous

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vacuous_${{ matrix.platform }}
          path: vacuous_${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 vacuous_*.tar.gz > vacuous-SHA256SUMS
          cat vacuous-SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vacuous_*.tar.gz
            dist/vacuous-SHA256SUMS
